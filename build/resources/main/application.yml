  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            client-id: Bk3N72efnsyhrLVpXesC
            client-secret: mEzZotpnN9
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
